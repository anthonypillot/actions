name: 🚀 Deploy

on:
  workflow_call:
    inputs:
      registry_url:
        type: string
        description: Registry where the image is stored (e.g. registry-1.docker.io).
        required: false
        default: registry-1.docker.io
      registry_username:
        type: string
        description: Registry username.
        required: true
      environment:
        type: string
        description: GitHub repository environment to deploy to (e.g. 'production', 'staging').
        required: true
      namespace_name:
        type: string
        description: Namespace to deploy to (e.g. 'default', 'my-namespace').
        required: true
      deployment_name:
        type: string
        description: Deployment to deploy (e.g. 'my-deployment').
        required: true
      container_name:
        type: string
        description: Container to update. Defaults to the deployment name.
        required: false
        default: ""
      image_name:
        type: string
        description: Image to deploy (e.g. 'my-image').
        required: true
      image_tag:
        type: string
        description: Tag to deploy (e.g. 'latest', '1.2.3').
        required: false
        default: latest
    secrets:
      kubeconfig:
        description: Kubeconfig to use, base64 encoded.
        required: true

jobs:
  deploy:
    name: Version [${{ inputs.image_tag }}] on [${{ inputs.environment }}]
    runs-on: ubuntu-latest

    concurrency: ${{ inputs.environment }} # refer to https://docs.github.com/en/actions/using-jobs/using-concurrency
    environment:
      name: ${{ inputs.environment }} # refer to your GitHub repository environment

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: ⚙️ Set up kubectl
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.kubeconfig }}

      - name: 🔊 Display deployment state before update
        run: kubectl get deployments -n ${{ inputs.namespace_name }} ${{ inputs.deployment_name }} -o=wide

      - name: 🚀 Set image tag to [${{ inputs.image_tag }}]
        env:
          CONTAINER_NAME: ${{ inputs.container_name || inputs.deployment_name }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          IMAGE: ${{ inputs.registry_url }}/${{ inputs.registry_username }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          NAMESPACE_NAME: ${{ inputs.namespace_name }}
        run: |
          current_image=$(kubectl get deployment "$DEPLOYMENT_NAME" \
            --namespace "$NAMESPACE_NAME" \
            --output "jsonpath={.spec.template.spec.containers[?(@.name=='$CONTAINER_NAME')].image}")

          if [[ "$current_image" == "$IMAGE" ]]; then
            kubectl rollout restart deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE_NAME"
          else
            kubectl set image deployment/"$DEPLOYMENT_NAME" \
              "$CONTAINER_NAME=$IMAGE" \
              --namespace "$NAMESPACE_NAME"
          fi

      - name: 🔄 Rollout status
        run: kubectl rollout status -n ${{ inputs.namespace_name }} deployment/${{ inputs.deployment_name }} --timeout=5m

      - name: 🔊 Display deployment state after update
        run: kubectl get deployments -n ${{ inputs.namespace_name }} ${{ inputs.deployment_name }} -o=wide
